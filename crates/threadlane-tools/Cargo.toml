[package]
name = "threadlane-tools"
version = "0.1.0"
edition = "2021"
description = "Built-in coding tools and execution primitives for threadlane agent"

[features]
default = []
hotpath = ["hotpath/hotpath"]

[dependencies]
threadlane-hashline = { version = "0.1.0", path = "../threadlane-hashline" }
threadlane-auth = { version = "0.1.0", path = "../threadlane-auth" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
hotpath = "0.24"
tempfile = "3.8"
