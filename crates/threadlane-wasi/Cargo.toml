[package]
name = "threadlane-wasi"
version = "0.1.0"
edition = "2021"
description = "WASI WebAssembly extension sandbox host and capability broker for threadlane agent"

[dependencies]
threadlane-runtime = { version = "0.1.0", path = "../threadlane-runtime" }
wasmi = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
md5 = "0.7"
async-trait = "0.1"
directories = "5.0"

[dev-dependencies]
tempfile = "3.10"
