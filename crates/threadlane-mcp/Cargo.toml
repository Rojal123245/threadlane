[package]
name = "threadlane-mcp"
version = "0.1.0"
edition = "2021"
description = "Model Context Protocol (MCP) client engine for threadlane agent"

[dependencies]
threadlane-agent = { path = "../threadlane-agent" }
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
futures = "0.3"
