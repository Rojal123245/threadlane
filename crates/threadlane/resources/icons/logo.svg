<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
  <!-- Three staggered crossbar lanes -->
  <path d="M2 5h20"/>
  <path d="M2 7.2h20"/>
  <path d="M2 9.4h20"/>

  <!-- Three stem threads descending from crossbar into lanes -->
  <path d="M9.8 5L9.6 19.5"/>
  <path d="M12 7.2V19.5"/>
  <path d="M14.2 9.4L14.4 19.5"/>

  <!-- Outer lane rails (thinner paths) -->
  <path d="M8 11.5L7.9 19.5" stroke-width="0.6"/>
  <path d="M16 11.5L16.1 19.5" stroke-width="0.6"/>

  <!-- Lane divider dashes (short segments between threads) -->
  <path d="M10.8 12.5v1.4" stroke-width="0.6"/>
  <path d="M10.8 15.5v1.4" stroke-width="0.6"/>
  <path d="M10.8 18.2v0.8" stroke-width="0.6"/>
  <path d="M13.2 12.5v1.4" stroke-width="0.6"/>
  <path d="M13.2 15.5v1.4" stroke-width="0.6"/>
  <path d="M13.2 18.2v0.8" stroke-width="0.6"/>
</svg>
