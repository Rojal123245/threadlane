[workspace]
# Threadlane ships as one application release even though its implementation is
# split across a Cargo workspace. Internal crates are not released separately.
release = false
release_always = false
changelog_update = false
git_release_enable = false
git_tag_enable = false
dependencies_update = false

[[package]]
name = "threadlane"
release = true
git_only = true
publish = false
changelog_update = true
changelog_path = "./CHANGELOG.md"
git_release_enable = true
git_tag_enable = true
git_tag_name = "v{{ version }}"
git_release_name = "Threadlane v{{ version }}"
git_release_type = "auto"
changelog_include = [
    "threadlane-agent",
    "threadlane-auth",
    "threadlane-cli",
    "threadlane-coding-agent",
    "threadlane-git",
    "threadlane-hashline",
    "threadlane-mcp",
    "threadlane-provider",
    "threadlane-skills",
    "threadlane-tools",
    "threadlane-updater",
    "threadlane-wasi",
    "broker-smoke-ext",
    "debug-ext",
    "lsp-ext",
]
git_release_body = """
{{ changelog }}
{% if remote.contributors %}
### Contributors
{% for contributor in remote.contributors %}
* @{{ contributor.username }}
{% endfor %}
{% endif %}
"""
