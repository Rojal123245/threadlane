name: hotpath-comment

on:
  workflow_run:
    workflows: [hotpath-profile]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: actions/download-artifact@v4
        with:
          pattern: hotpath-metrics-*
          path: /tmp/metrics/
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Install hotpath-utils
        run: cargo install hotpath --version '^0.24' --bin hotpath-utils --features utils
      - name: Post benchmark comparison
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for metrics in /tmp/metrics/*; do
            test -d "$metrics" || continue
            if ! test -f "$metrics/base.json"; then
              echo "No base metrics for $(basename "$metrics"); skipping"
              continue
            fi
            hotpath-utils profile-pr \
              --head-metrics "$metrics/head.json" \
              --base-metrics "$metrics/base.json" \
              --pr-number "$(cat "$metrics/pr_number.txt")" \
              --benchmark-id "$(basename "$metrics")" \
              --github-token "$GH_TOKEN"
          done
