name: hotpath-comment

on:
  workflow_run:
    workflows: [hotpath-profile]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: actions/download-artifact@v4
        with:
          name: hotpath-metrics
          path: /tmp/metrics/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Install hotpath-utils
        run: cargo install hotpath --version '^0.24' --bin hotpath-utils --features utils
      - name: Post benchmark comparison
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! test -f /tmp/metrics/base.json; then
            echo "No base metrics to compare yet"
            exit 0
          fi
          hotpath-utils profile-pr \
            --head-metrics /tmp/metrics/head.json \
            --base-metrics /tmp/metrics/base.json \
            --pr-number "$(cat /tmp/metrics/pr_number.txt)" \
            --benchmark-id jsonl \
            --github-token "$GH_TOKEN"
