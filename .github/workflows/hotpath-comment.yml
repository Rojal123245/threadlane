name: hotpath-comment

on:
  workflow_run:
    workflows: [hotpath-profile]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  comment:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: actions/download-artifact@v4
        with:
          pattern: hotpath-metrics-*
          path: /tmp/metrics/
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Install hotpath-utils
        run: cargo install hotpath --version '^0.24' --bin hotpath-utils --features utils
      - name: Post benchmark comparison
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number="${{ github.event.workflow_run.pull_requests[0].number }}"
          if test -z "$pr_number"; then
            echo "Workflow run has no pull request; skipping"
            exit 0
          fi
          for metrics in /tmp/metrics/*; do
            test -d "$metrics" || continue
            suite_id="$(basename "$metrics")"
            case "$suite_id" in
              runtime|tools|mcp|terminal) ;;
              *)
                echo "Skipping unexpected benchmark suite: $suite_id"
                continue
                ;;
            esac
            if ! test -f "$metrics/head.json" || ! test -f "$metrics/base.json"; then
              echo "Missing metrics for $suite_id; skipping"
              continue
            fi
            if ! hotpath-utils profile-pr \
              --head-metrics "$metrics/head.json" \
              --base-metrics "$metrics/base.json" \
              --pr-number "$pr_number" \
              --benchmark-id "$suite_id" \
              --github-token "$GH_TOKEN"; then
              echo "Comparison failed for $suite_id; continuing"
            fi
          done
