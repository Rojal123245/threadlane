name: Surface Parity

on:
  pull_request:
    paths:
      - "crates/**"
      - "scripts/check_surface_parity.sh"
      - ".github/workflows/surface-parity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check documented surfaces
        run: scripts/check_surface_parity.sh
