name: hotpath-profile

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: hotpath-profile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  profile:
    env:
      HOTPATH_METRICS_SERVER_OFF: 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        id: [runtime, tools, mcp, terminal]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: hotpath-profile
      - run: mkdir -p /tmp/metrics/${{ matrix.id }}
      - name: Benchmark head
        env:
          HOTPATH_OUTPUT_FORMAT: json
          HOTPATH_OUTPUT_PATH: /tmp/metrics/${{ matrix.id }}/head.json
        run: cargo run -p threadlane-benchmarks --release --bin ${{ matrix.id }} --features hotpath
      - name: Benchmark base
        env:
          HOTPATH_OUTPUT_FORMAT: json
          HOTPATH_OUTPUT_PATH: /tmp/metrics/${{ matrix.id }}/base.json
        run: |
          git checkout --force '${{ github.event.pull_request.base.sha }}'
          if test -f 'crates/threadlane-benchmarks/src/bin/${{ matrix.id }}.rs'; then
            cargo run -p threadlane-benchmarks --release --bin ${{ matrix.id }} --features hotpath
          else
            echo "Base branch has no centralized Hotpath benchmark yet"
          fi
      - name: Save PR number
        run: echo '${{ github.event.pull_request.number }}' > /tmp/metrics/${{ matrix.id }}/pr_number.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hotpath-metrics-${{ matrix.id }}
          path: /tmp/metrics/
          retention-days: 1
