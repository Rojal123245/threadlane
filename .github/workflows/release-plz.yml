name: Release-plz

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    if: ${{ github.repository_owner == 'wheregmis' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
      pull-requests: read
    outputs:
      release_created: ${{ steps.release-plz.outputs.releases_created }}
      release_tag: ${{ fromJSON(steps.release-plz.outputs.releases)[0].tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Create tag and GitHub release
        id: release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  package-release:
    name: Build release packages
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}
    secrets: inherit

  release-pr:
    name: Prepare release pull request
    runs-on: ubuntu-24.04
    if: ${{ github.repository_owner == 'wheregmis' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Create or update release pull request
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
